name: Sincronizar resultados SerpAPI

on:
  workflow_dispatch:
  schedule:
    # UTC. Equivale a 16h, 18h, 20h, 22h e 00h em America/Sao_Paulo.
    - cron: "0 19,21,23,1,3 * * *"

jobs:
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      SERPAPI_RESULT_DELAY_MINUTES: ${{ vars.SERPAPI_RESULT_DELAY_MINUTES || '120' }}
      SERPAPI_RESULT_MAX_MATCHES: ${{ vars.SERPAPI_RESULT_MAX_MATCHES || '12' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync final results
        run: npm run result:sync-serpapi
